      <button class="btn btn-filled btn-block" type="submit" id="login-btn">Sign in</button>
      <div class="login-first hidden" id="login-first">
        <p>No dashboard password is set yet. Yoru is reachable by anyone on the network until you create one.</p>
        <a class="btn btn-tonal" href="#/settings">Create password in Settings</a>
      </div>
    </form>
  </div>
</div>

<div id="snackbars" class="snackbars" role="status" aria-live="polite"></div>
<div id="dialog-host" class="dialog-host hidden"></div>

<noscript><p style="padding:2rem;text-align:center">The Yoru dashboard needs JavaScript. Everything runs locally from the daemon; no internet access is required.</p></noscript>
</body>
</html>
